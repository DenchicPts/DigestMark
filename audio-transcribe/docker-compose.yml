services:
  whisper:
    build: .
    container_name: whisper
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - ./models:/models           # модели скачиваются сюда и остаются между перезапусками
    environment:
      - MODEL_SIZE=large-v3-turbo  # tiny | base | small | medium | large-v3-turbo
      - CPU_THREADS=0              # 0 = авто
      - DEVICE=cpu
      - LANGUAGE=                  # пусто = авто-определение
      - IDLE_TIMEOUT=300           # секунд простоя до выгрузки модели
      - BEAM_SIZE=5                # 1=быстро/мало RAM, 2=баланс, 5=максимум точности
      - MALLOC_ARENA_MAX=2
      - MALLOC_MMAP_THRESHOLD_=131072
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
